[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-db-mini"
version = "0.1.0"
description = "A tiny, CPU-runnable vector search and embedding-infra demo for the AI Infra Handbook."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vector-db-demo = "vector_db_mini.demo:run_demo"

[tool.setuptools.packages.find]
where = ["."]
include = ["vector_db_mini*"]
