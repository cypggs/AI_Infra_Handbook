[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-case-mini"
version = "0.1.0"
description = "Perplexity 案例研究：答案引擎推理经济学模拟器（AI Infra Handbook Mini Demo）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["perplexity_case_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
