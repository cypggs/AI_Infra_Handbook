[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-case-mini"
version = "0.1.0"
description = "Cursor 案例研究核心机制模拟器（AI Infra Handbook Mini Demo）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["cursor_case_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
