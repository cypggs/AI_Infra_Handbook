[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-case-mini"
version = "0.1.0"
description = "DeepSeek 训练系统核心机制模拟器：DualPipe / FP8 / EP all-to-all / MLA（AI Infra Handbook Mini Demo）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["deepseek_case_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
