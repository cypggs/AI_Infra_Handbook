[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "training-reliability-mini"
version = "0.1.0"
description = "CPU-runnable training reliability and fault tolerance mini-demo for AI Infra Handbook"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
