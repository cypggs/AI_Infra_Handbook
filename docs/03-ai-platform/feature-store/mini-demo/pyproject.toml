[project]
name = "feature-store-mini"
version = "0.1.0"
description = "Minimal feature store mini-demo: point-in-time joins, online store with TTL, and skew detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
