[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-inference-mini"
version = "0.1.0"
description = "CPU-runnable mini demo of multimodal & speech inference infrastructure: visual token scheduling, voice latency budgets, audio codec tokens and full-duplex state machine"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_inference_mini*"]

[project.scripts]
multimodal-inference-demo = "multimodal_inference_mini.demo:run_demo"
